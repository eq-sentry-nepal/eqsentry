# Deploys the static site to GitHub Pages on every push to main.
#
# This builds first (npm run build -> dist/) rather than publishing the repo
# root. That matters for three reasons:
#   1. Pages serves the same minified bundle as every other host.
#   2. Build-time config injection (CARTO_API_KEY etc.) actually reaches it.
#   3. build.mjs's allowlist applies, so server/, docs/, scripts/, package.json
#      and the rest of the tooling are never published to the live site.
# First run also enables Pages on the repo automatically (enablement: true).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci
      - name: Build site
        run: npm run build
        env:
          # All optional — unset values keep config.js's committed defaults.
          # CARTO_API_KEY is a repository *secret* (Settings -> Secrets and
          # variables -> Actions); the basemap URLs are plain repo *variables*.
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
          CARTO_BASEMAP_DARK: ${{ vars.CARTO_BASEMAP_DARK }}
          CARTO_BASEMAP_LIGHT: ${{ vars.CARTO_BASEMAP_LIGHT }}
      - name: Smoke-test the bundle before publishing
        run: node scripts/smoke-test.mjs --root dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
